name: Sprint_9

on:
  push:
    branches: ["**"]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Print project tree
        run: tree .

      - name: Build test image
        run: docker build -t my-tests .

      - name: Pull Selenoid Chrome image
        run: docker pull selenoid/chrome:128.0

      - name: Start Selenoid and Selenoid UI
        run: docker compose up -d selenoid selenoid-ui

      - name: Wait for Selenoid
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:4444/status | grep -q '"browsers"'; then
              echo "Selenoid is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Selenoid did not start"
          docker compose logs selenoid
          exit 1

      - name: Run tests
        run: docker compose run --rm test_docker

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v